<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1380" width="1100" height="1380" style="background:#0f172a; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="grad-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="grad-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="grad-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
  </defs>

  <!-- Title & Header -->
  <rect x="50" y="30" width="1000" height="90" rx="16" fill="url(#grad-card)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="550" y="68" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="700">FLUXO ORQUESTRADO DO ASSISTENTE MÉDICO (LANGGRAPH)</text>
  <text x="550" y="98" text-anchor="middle" fill="#94a3b8" font-size="14">Tech Challenge FIAP Fase 3 • 14 nós • LangChain + StateGraph + Guardrails + Auditoria</text>

  <!-- Node 1: Entry / Request -->
  <g transform="translate(415, 150)">
    <rect width="270" height="60" rx="30" fill="url(#grad-blue)" filter="url(#shadow)"/>
    <text x="135" y="35" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="600">POST /assistant/query</text>
    <text x="135" y="50" text-anchor="middle" fill="#bfdbfe" font-size="11">Entrada da Requisição Clínica</text>
  </g>

  <!-- Flow down -->
  <line x1="550" y1="210" x2="550" y2="245" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node 2: validate_input (Guardrail) -->
  <g transform="translate(340, 250)">
    <rect width="420" height="70" rx="12" fill="url(#grad-card)" stroke="#ef4444" stroke-width="2" filter="url(#shadow)"/>
    <rect x="15" y="15" width="40" height="40" rx="8" fill="url(#grad-red)"/>
    <text x="35" y="40" text-anchor="middle" fill="#ffffff" font-size="18">🛡️</text>
    <text x="68" y="38" fill="#f8fafc" font-size="15" font-weight="600">validate_input</text>
    <text x="68" y="56" fill="#94a3b8" font-size="11.5">Bloqueia prescrição direta ou diagnóstico na pergunta</text>
  </g>

  <!-- Conditional Branch 1 -->
  <!-- Blocked edge to format_blocked -->
  <path d="M 340 285 L 180 285 L 180 1020" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow-red)"/>
  <rect x="195" y="270" width="135" height="24" rx="6" fill="#450a0a" stroke="#ef4444" stroke-width="1"/>
  <text x="262" y="286" text-anchor="middle" fill="#fca5a5" font-size="11" font-weight="600">Prescrição detectada</text>

  <!-- Valid edge down -->
  <line x1="550" y1="320" x2="550" y2="355" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)"/>
  <rect x="560" y="325" width="95" height="20" rx="4" fill="#064e3b"/>
  <text x="607" y="339" text-anchor="middle" fill="#6ee7b7" font-size="11">Entrada Válida</text>

  <!-- Node 3: load_patient_context (SQLite) -->
  <g transform="translate(340, 360)">
    <rect width="420" height="65" rx="12" fill="url(#grad-card)" stroke="#06b6d4" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="15" y="12" width="40" height="40" rx="8" fill="url(#grad-teal)"/>
    <text x="35" y="38" text-anchor="middle" fill="#ffffff" font-size="18">📁</text>
    <text x="68" y="36" fill="#f8fafc" font-size="15" font-weight="600">load_patient_context</text>
    <text x="68" y="54" fill="#94a3b8" font-size="11.5">Consulta prontuário, sintomas e notas (SQLite)</text>
  </g>

  <line x1="550" y1="425" x2="550" y2="455" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node 4: retrieve_protocols -->
  <g transform="translate(340, 460)">
    <rect width="420" height="65" rx="12" fill="url(#grad-card)" stroke="#06b6d4" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="15" y="12" width="40" height="40" rx="8" fill="url(#grad-teal)"/>
    <text x="35" y="38" text-anchor="middle" fill="#ffffff" font-size="18">📖</text>
    <text x="68" y="36" fill="#f8fafc" font-size="15" font-weight="600">retrieve_protocols</text>
    <text x="68" y="54" fill="#94a3b8" font-size="11.5">Recupera protocolos clínicos aplicáveis (SQLite)</text>
  </g>

  <line x1="550" y1="525" x2="550" y2="555" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node 5: review_pending_exams -->
  <g transform="translate(340, 560)">
    <rect width="420" height="65" rx="12" fill="url(#grad-card)" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="15" y="12" width="40" height="40" rx="8" fill="url(#grad-blue)"/>
    <text x="35" y="38" text-anchor="middle" fill="#ffffff" font-size="18">🔬</text>
    <text x="68" y="36" fill="#f8fafc" font-size="15" font-weight="600">review_pending_exams</text>
    <text x="68" y="54" fill="#94a3b8" font-size="11">Identifica e lista exames laboratoriais/imagem pendentes</text>
  </g>

  <line x1="550" y1="625" x2="550" y2="655" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node 6: evaluate_alerts & suggest_actions -->
  <g transform="translate(340, 660)">
    <rect width="420" height="65" rx="12" fill="url(#grad-card)" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="15" y="12" width="40" height="40" rx="8" fill="url(#grad-amber)"/>
    <text x="35" y="38" text-anchor="middle" fill="#ffffff" font-size="18">⚠️</text>
    <text x="68" y="36" fill="#f8fafc" font-size="15" font-weight="600">evaluate_alerts &amp; suggest_actions</text>
    <text x="68" y="54" fill="#94a3b8" font-size="11">Gera alertas de risco clínico e recomendações preliminares</text>
  </g>

  <line x1="550" y1="725" x2="550" y2="755" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Nodes 8-9: build_prompt & generate_answer (LLM Adapter) -->
  <g transform="translate(325, 760)">
    <rect width="450" height="85" rx="12" fill="url(#grad-card)" stroke="#8b5cf6" stroke-width="2" filter="url(#shadow)"/>
    <rect x="15" y="20" width="45" height="45" rx="8" fill="url(#grad-purple)"/>
    <text x="37" y="48" text-anchor="middle" fill="#ffffff" font-size="20">🤖</text>
    <text x="75" y="38" fill="#f8fafc" font-size="16" font-weight="700">build_prompt → generate_answer</text>
    <text x="75" y="57" fill="#c4b5fd" font-size="11.5">• Primário: TinyLlama 1.1B Fine-Tuned (LoRA / PEFT)</text>
    <text x="75" y="73" fill="#94a3b8" font-size="11.5">• Falha Item 1 → Gemini; falha dupla → síntese segura</text>
  </g>

  <line x1="550" y1="845" x2="550" y2="875" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node 8: validate_output (Guardrail de Saída & Qualidade) -->
  <g transform="translate(325, 880)">
    <rect width="450" height="85" rx="12" fill="url(#grad-card)" stroke="#ef4444" stroke-width="2" filter="url(#shadow)"/>
    <rect x="15" y="20" width="45" height="45" rx="8" fill="url(#grad-red)"/>
    <text x="37" y="48" text-anchor="middle" fill="#ffffff" font-size="20">🛡️</text>
    <text x="75" y="38" fill="#f8fafc" font-size="16" font-weight="700">validate_output (Guardrail &amp; Quality)</text>
    <text x="75" y="57" fill="#94a3b8" font-size="11.5">• Bloqueia dosagens, prescrições e diagnóstico definitivo</text>
    <text x="75" y="73" fill="#94a3b8" font-size="11.5">• Verifica consistência de fontes (check_citation_consistency)</text>
  </g>

  <!-- Conditional Branch 2 -->
  <!-- Saída insegura segue para síntese segura determinística -->
  <path d="M 325 922 L 180 922 L 180 1020" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow-red)"/>
  <rect x="190" y="907" width="130" height="24" rx="6" fill="#450a0a" stroke="#ef4444" stroke-width="1"/>
  <text x="255" y="923" text-anchor="middle" fill="#fca5a5" font-size="11" font-weight="600">Saída retida</text>

  <!-- Success down to format_response -->
  <line x1="550" y1="965" x2="550" y2="1015" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)"/>
  <rect x="560" y="975" width="115" height="20" rx="4" fill="#064e3b"/>
  <text x="617" y="989" text-anchor="middle" fill="#6ee7b7" font-size="11">Resposta Aprovada</text>

  <!-- Node 9A: format_blocked -->
  <g transform="translate(50, 1025)">
    <rect width="260" height="70" rx="12" fill="url(#grad-card)" stroke="#ef4444" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="130" y="33" text-anchor="middle" fill="#fca5a5" font-size="14" font-weight="600">format_blocked</text>
    <text x="130" y="50" text-anchor="middle" fill="#94a3b8" font-size="11">Retém resposta médica perigosa</text>
    <text x="130" y="65" text-anchor="middle" fill="#f87171" font-size="10">requires_human_review = True</text>
  </g>

  <!-- Node 9B: format_response -->
  <g transform="translate(410, 1025)">
    <rect width="280" height="70" rx="12" fill="url(#grad-card)" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="140" y="29" text-anchor="middle" fill="#6ee7b7" font-size="13" font-weight="600">format_response</text>
    <text x="140" y="46" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="600">format_safe_fallback</text>
    <text x="140" y="62" text-anchor="middle" fill="#94a3b8" font-size="10">saída insegura ou falha dupla de provider</text>
  </g>

  <!-- Node 9C: format_error -->
  <g transform="translate(790, 1025)">
    <rect width="260" height="70" rx="12" fill="url(#grad-card)" stroke="#64748b" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="130" y="33" text-anchor="middle" fill="#cbd5e1" font-size="14" font-weight="600">format_error</text>
    <text x="130" y="53" text-anchor="middle" fill="#94a3b8" font-size="11">Tratamento de exceções e timeout</text>
  </g>

  <!-- Converge to log_interaction -->
  <path d="M 180 1095 L 180 1145 L 550 1145" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <line x1="550" y1="1095" x2="550" y2="1145" stroke="#94a3b8" stroke-width="2"/>
  <path d="M 920 1095 L 920 1145 L 550 1145" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <line x1="550" y1="1145" x2="550" y2="1175" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node 10: log_interaction (Audit Trail) -->
  <g transform="translate(250, 1180)">
    <rect width="600" height="70" rx="12" fill="url(#grad-card)" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)"/>
    <rect x="15" y="15" width="40" height="40" rx="8" fill="url(#grad-teal)"/>
    <text x="35" y="40" text-anchor="middle" fill="#ffffff" font-size="18">📝</text>
    <text x="70" y="38" fill="#f8fafc" font-size="15" font-weight="700">log_interaction (Auditoria Estruturada)</text>
    <text x="70" y="56" fill="#94a3b8" font-size="11">Persiste request_id, prompts, resposta crua e validações no SQLite (ou fallback JSONL)</text>
  </g>

  <line x1="550" y1="1250" x2="550" y2="1285" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node 11: END -->
  <g transform="translate(475, 1290)">
    <rect width="150" height="45" rx="22.5" fill="#334155" filter="url(#shadow)"/>
    <text x="75" y="28" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="700">END</text>
  </g>
</svg>
